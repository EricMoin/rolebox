name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ROLEBOX_FATAL_STDERR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Windows process lifecycle acceptance
        if: matrix.os == 'windows-latest'
        run: npm test -- tests/platform/pi-worker-sandbox.test.ts
      - name: Install Chromium for worker acceptance
        if: matrix.os == 'macos-latest'
        run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run build
      - run: npm run test:package
      - name: Isolated core tests
        run: npm run test:core
      - name: Isolated TUI tests
        run: npm run test:tui
      - name: Module mock order guard (forward)
        run: npm test -- tests/cli/commands/install.test.ts tests/cli/registry-client.test.ts --file-order
      - name: Module mock order guard (reverse)
        run: npm test -- tests/cli/registry-client.test.ts tests/cli/commands/install.test.ts --file-order
      - name: Randomized core tests
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:core -- --sequence.shuffle
      - name: Randomized TUI tests
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:tui -- --sequence.shuffle
      - name: Real SDK host acceptance
        if: matrix.os == 'macos-latest'
        run: npm run test:hosts:e2e
      - name: Check for test artifacts
        shell: bash
        run: |
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            echo "::error::Working tree dirty after tests"
            printf '%s\n' "$dirty"
            exit 1
          fi

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Allow sandboxed Playwright Chromium
        run: |
          cat > "$RUNNER_TEMP/rolebox-playwright.apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile rolebox-playwright "${HOME}/.cache/ms-playwright/**/chrome{,-headless-shell}" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/rolebox-playwright.apparmor"
      - run: npm run test:browse:e2e
