name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check (full project)
        run: bun run typecheck

      - name: Build TUI module (bundle + declarations)
        run: bun run build:tui

      - name: Run tests
        run: bun test
