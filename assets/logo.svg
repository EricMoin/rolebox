<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="rolebox logo">
  <title>rolebox</title>
  <!-- Flat dark surface; visible as a tile on light backgrounds, subtle on dark -->
  <rect width="512" height="512" rx="112" ry="112" fill="#0D1117"/>
  <!-- Single-letter logomark: R in Space Grotesk Bold, sky blue accent. Flat, no gradient -->
  <text x="256" y="256"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Space Grotesk', 'SpaceGrotesk', 'Space Grotesk Bold', system-ui, sans-serif"
        font-weight="700"
        font-size="336"
        fill="#0EA5E9">R</text>
</svg>
