# rolebox as a dsh profile bundle layer (contract: docs/dsh-plugin-contract.md §5.3).
#
# `name` points at the package subpath export `./dsh` (dist/dsh-plugin.js),
# which default-exports the cordis Object plugin `{ name, inject, Config,
# apply }`. The package root (`main` → dist/index.js) is the opencode plugin
# and is NOT a cordis plugin, so it must not be referenced here — this row
# follows the verified "scoped sub-path" name form used by the dsh-base
# bundle (e.g. `@deepseek-ai/dsh-tool-subagent-control/list-agents`).
#
# `config` enables the web role-switch adapter: webEnabled turns on the
# loopback-only role-switch web UI at http://127.0.0.1:8787 (webHost and
# webPort default to 127.0.0.1 / 8787). All other Config options stay at
# their dsh defaults (roleboxDir under $DSH_HOME, all namespaces enabled).
- insert:
    - id: rolebox
      name: rolebox/dsh
      config:
        # Web role-switch adapter: a rolebox-served loopback HTTP page for
        # inspecting/switching the active role (see README "Running as a dsh
        # plugin" → "Web role-switch adapter"). webHost defaults to 127.0.0.1
        # (loopback only); webPort defaults to 8787.
        webEnabled: true
        webPort: 8787
